name: Deploy learning library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website and Markdown sources
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/
            /assistant/
            *.md
            *.url
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Test Markdown and path handling
        run: npm test
        working-directory: site
      - name: Test public Q&A permissions and agent
        run: npm test
        working-directory: assistant
      - name: Build and check the website
        run: npm run build && npm run check
        working-directory: site
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
